<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="installTitle installDesc" font-family="'Microsoft YaHei UI','Microsoft YaHei','Segoe UI',sans-serif" text-rendering="geometricPrecision">
  <title id="installTitle">HustMCL 安装游戏界面设计预览</title>
  <desc id="installDesc">Campus Desk 方向：垂直安装步骤、版本与目录、取消入口。总量未知时只显示阶段与已传输字节，不显示虚构百分比。版本、目录与进度为样例数据。</desc>

  <rect x="0" y="0" width="1120" height="720" fill="#F4F0E7"/>

  <!-- Windows 系统标题栏示意 -->
  <g id="titlebar">
    <rect x="0" y="0" width="1120" height="40" fill="#EFE9DE"/>
    <rect x="0" y="39" width="1120" height="1" fill="#DED5C6"/>
    <rect x="16" y="12" width="16" height="16" rx="4" fill="#8C1D2F"/>
    <text x="24" y="23.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">H</text>
    <text x="40" y="25" font-size="12.5" font-weight="600" fill="#23201C">HustMCL</text>
    <text x="94" y="25" font-size="11.5" fill="#6F675D">· 安装游戏</text>
    <rect x="880" y="10" width="140" height="20" rx="10" fill="#F2E3DF"/>
    <text x="950" y="24" text-anchor="middle" font-size="10.5" fill="#8C1D2F">设计预览 · 样例数据</text>
    <g stroke="#6F675D" stroke-width="1.4" stroke-linecap="round" fill="none">
      <line x1="1052" y1="20" x2="1062" y2="20"/>
      <rect x="1076" y="15" width="10" height="10" rx="1"/>
      <line x1="1100" y1="15" x2="1110" y2="25"/>
      <line x1="1110" y1="15" x2="1100" y2="25"/>
    </g>
  </g>

  <!-- 侧栏：安装游戏为当前页 -->
  <g id="sidebar">
    <rect x="0" y="40" width="216" height="680" fill="#FBF8F1"/>
    <rect x="215" y="40" width="1" height="680" fill="#DED5C6"/>
    <rect x="24" y="64" width="30" height="30" rx="8" fill="#8C1D2F"/>
    <text x="39" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">H</text>
    <text x="64" y="82" font-size="17" font-weight="700" fill="#23201C">HustMCL</text>
    <text x="64" y="99" font-size="10.5" fill="#6F675D">校园启动器</text>
    <rect x="24" y="128" width="168" height="1" fill="#DED5C6"/>

    <g id="nav-home">
      <text x="32" y="183" font-size="10.5" fill="#6F675D" letter-spacing="1">01</text>
      <text x="64" y="183" font-size="14" fill="#6F675D">首页</text>
    </g>
    <g id="nav-install">
      <rect x="16" y="202" width="184" height="46" rx="7" fill="#F2E3DF"/>
      <rect x="16" y="212" width="3" height="24" rx="1.5" fill="#8C1D2F"/>
      <text x="32" y="229" font-size="10.5" font-weight="600" fill="#8C1D2F" letter-spacing="1">02</text>
      <text x="64" y="229" font-size="14" font-weight="700" fill="#8C1D2F">安装游戏</text>
    </g>
    <g id="nav-settings">
      <text x="32" y="275" font-size="10.5" fill="#6F675D" letter-spacing="1">03</text>
      <text x="64" y="275" font-size="14" fill="#6F675D">设置</text>
    </g>
    <g id="nav-logs">
      <text x="32" y="321" font-size="10.5" fill="#6F675D" letter-spacing="1">04</text>
      <text x="64" y="321" font-size="14" fill="#6F675D">日志与错误</text>
    </g>

    <g id="account">
      <rect x="24" y="580" width="168" height="1" fill="#DED5C6"/>
      <circle cx="40" cy="614" r="16" fill="#F2E3DF"/>
      <text x="40" y="619" text-anchor="middle" font-size="13" font-weight="700" fill="#8C1D2F">林</text>
      <text x="66" y="610" font-size="13" font-weight="600" fill="#23201C">林知远</text>
      <circle cx="68" cy="628" r="3" fill="#4F6B52"/>
      <text x="76" y="632" font-size="11" fill="#6F675D">已连接</text>
      <text x="24" y="660" font-size="11.5" fill="#6F675D">账号与授权 →</text>
    </g>
    <text x="24" y="700" font-size="10.5" fill="#6F675D">HustMCL 0.1 · 设计预览</text>
  </g>

  <!-- 页面标题 -->
  <g id="page-header">
    <text x="248" y="112" font-size="30" font-weight="600" fill="#23201C" letter-spacing="-0.5">安装游戏</text>
    <text x="248" y="136" font-size="13" fill="#6F675D">为校园生存准备 Minecraft 1.21.4</text>
    <text x="1088" y="136" text-anchor="end" font-size="12" fill="#6F675D">阶段 4 / 6</text>
  </g>

  <g id="desk">
    <rect x="248" y="168" width="840" height="504" rx="14" fill="#FFFCF6" stroke="#DED5C6"/>

    <!-- 垂直安装步骤 -->
    <g id="steps">
      <text x="280" y="212" font-size="12" font-weight="600" fill="#23201C">安装步骤</text>
      <rect x="293" y="226" width="1" height="320" fill="#E8DFD1"/>

      <circle cx="293" cy="242" r="13" fill="#8C1D2F"/>
      <text x="293" y="246" text-anchor="middle" font-size="11" fill="#FFFFFF">✓</text>
      <text x="318" y="240" font-size="13.5" font-weight="600" fill="#23201C">未安装</text>
      <text x="318" y="258" font-size="12" fill="#6F675D">目标目录为空</text>

      <circle cx="293" cy="288" r="13" fill="#8C1D2F"/>
      <text x="293" y="292" text-anchor="middle" font-size="11" fill="#FFFFFF">✓</text>
      <text x="318" y="286" font-size="13.5" font-weight="600" fill="#23201C">解析版本</text>
      <text x="318" y="304" font-size="12" fill="#6F675D">文件清单已确认</text>

      <circle cx="293" cy="334" r="13" fill="#8C1D2F"/>
      <text x="293" y="338" text-anchor="middle" font-size="11" fill="#FFFFFF">✓</text>
      <text x="318" y="332" font-size="13.5" font-weight="600" fill="#23201C">准备环境</text>
      <text x="318" y="350" font-size="12" fill="#6F675D">Java 运行时已就绪</text>

      <circle cx="293" cy="386" r="13" fill="#F2E3DF" stroke="#8C1D2F" stroke-width="2"/>
      <text x="293" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#8C1D2F">4</text>
      <text x="318" y="380" font-size="13.5" font-weight="600" fill="#23201C">下载文件</text>
      <text x="318" y="398" font-size="12" fill="#6F675D">正在下载游戏资源</text>
      <rect x="310" y="408" width="290" height="36" rx="6" fill="#FDF7F4" stroke="#D8B9B2" stroke-dasharray="5 4"/>
      <text x="322" y="430" font-size="11.5" font-weight="600" fill="#8C1D2F">总量未知</text>
      <text x="382" y="430" font-size="11.5" fill="#5F4A43">已传输 128.4 MB</text>

      <circle cx="293" cy="474" r="13" fill="#FFFCF6" stroke="#DED5C6"/>
      <text x="293" y="478" text-anchor="middle" font-size="11" fill="#6F675D">5</text>
      <text x="318" y="472" font-size="13.5" fill="#6F675D">校验文件</text>
      <text x="318" y="490" font-size="12" fill="#6F675D">下载完成后自动开始</text>

      <circle cx="293" cy="520" r="13" fill="#FFFCF6" stroke="#DED5C6"/>
      <text x="293" y="524" text-anchor="middle" font-size="11" fill="#6F675D">6</text>
      <text x="318" y="518" font-size="13.5" fill="#6F675D">就绪</text>
      <text x="318" y="536" font-size="12" fill="#6F675D">完成后可启动游戏</text>
    </g>

    <rect x="638" y="196" width="1" height="380" fill="#DED5C6"/>

    <!-- 版本、目录、空间与恢复说明 -->
    <g id="details">
      <text x="670" y="212" font-size="11.5" fill="#6F675D">本次安装</text>
      <text x="670" y="246" font-size="26" font-weight="600" fill="#23201C">1.21.4</text>
      <rect x="760" y="224" width="44" height="20" rx="10" fill="#F2E3DF"/>
      <text x="782" y="238" text-anchor="middle" font-size="10" fill="#8C1D2F">推荐</text>
      <rect x="810" y="224" width="56" height="20" rx="10" fill="#E8F1EC"/>
      <text x="838" y="238" text-anchor="middle" font-size="10" fill="#2F6B4F">已验证</text>
      <text x="670" y="266" font-size="12" fill="#6F675D">正式版 · 原版生存</text>

      <rect x="670" y="282" width="386" height="1" fill="#DED5C6"/>
      <text x="670" y="302" font-size="11.5" fill="#6F675D">安装目录</text>
      <rect x="670" y="310" width="386" height="34" rx="6" fill="#F8F4EC" stroke="#DED5C6"/>
      <text x="682" y="332" font-size="10.5" fill="#4D463D">D:\HustMCL\instances\campus-demo</text>
      <text x="670" y="354" font-size="11.5" fill="#6F675D">安装中不可更改目录。</text>

      <text x="670" y="376" font-size="11.5" fill="#6F675D">空间</text>
      <text x="670" y="398" font-size="12" fill="#23201C">预计需要</text>
      <text x="1056" y="398" text-anchor="end" font-size="12" font-weight="600" fill="#23201C">1.2 GB</text>
      <text x="670" y="422" font-size="12" fill="#23201C">当前可用</text>
      <text x="1056" y="422" text-anchor="end" font-size="12" font-weight="600" fill="#23201C">86.5 GB</text>

      <rect x="670" y="440" width="386" height="1" fill="#DED5C6"/>
      <text x="670" y="462" font-size="11.5" fill="#6F675D">取消与恢复</text>
      <text x="670" y="484" font-size="13" fill="#6F675D">取消后等待应用确认，保留已校验文件，</text>
      <text x="670" y="502" font-size="13" fill="#6F675D">不删除存档。再次安装会从检查缓存开始。</text>
      <text x="670" y="530" font-size="11.5" fill="#6F675D">完成后</text>
      <text x="670" y="552" font-size="13" fill="#6F675D">安装就绪不等于已进入游戏主菜单，</text>
      <text x="670" y="570" font-size="13" fill="#6F675D">启动状态会单独显示。</text>
    </g>

    <!-- 固定操作条：安装中只有取消入口 -->
    <g id="action-strip">
      <path d="M248 592H1088V658A14 14 0 0 1 1074 672H262A14 14 0 0 1 248 658Z" fill="#FFFCF6"/>
      <rect x="248" y="592" width="840" height="1" fill="#DED5C6"/>
      <text x="280" y="622" font-size="15" font-weight="600" fill="#23201C">安装进行中</text>
      <text x="280" y="642" font-size="12" fill="#6F675D">下载文件 · 总量未知 · 已传输 128.4 MB</text>
      <rect x="904" y="602" width="152" height="44" rx="7" fill="#FFFCF6" stroke="#C7A2A9"/>
      <text x="980" y="629" text-anchor="middle" font-size="13.5" font-weight="600" fill="#8C1D2F">取消安装</text>
    </g>
    <rect x="248" y="168" width="840" height="504" rx="14" fill="none" stroke="#DED5C6"/>
  </g>

  <g id="footer-note">
    <text x="248" y="690" font-size="10.5" fill="#6F675D">版本、目录与进度为样例数据；功能尚未接入。</text>
    <text x="1088" y="690" text-anchor="end" font-size="10.5" fill="#6F675D">Windows 系统标题栏</text>
  </g>
</svg>
