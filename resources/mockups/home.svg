<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="homeTitle homeDesc" font-family="'Microsoft YaHei UI','Microsoft YaHei','Segoe UI',sans-serif" text-rendering="geometricPrecision">
  <title id="homeTitle">HustMCL 首页界面设计预览</title>
  <desc id="homeDesc">Campus Desk 方向：暖纸色桌面、编号导航、原创校园线稿、清楚的准备状态与一个主操作。账号、实例与进度为样例数据。</desc>

  <rect x="0" y="0" width="1120" height="720" fill="#F4F0E7"/>

  <!-- Windows 系统标题栏示意 -->
  <g id="titlebar">
    <rect x="0" y="0" width="1120" height="40" fill="#EFE9DE"/>
    <rect x="0" y="39" width="1120" height="1" fill="#DED5C6"/>
    <rect x="16" y="12" width="16" height="16" rx="4" fill="#8C1D2F"/>
    <text x="24" y="23.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">H</text>
    <text x="40" y="25" font-size="12.5" font-weight="600" fill="#23201C">HustMCL</text>
    <text x="94" y="25" font-size="11.5" fill="#6F675D">· 首页</text>
    <rect x="880" y="10" width="140" height="20" rx="10" fill="#F2E3DF"/>
    <text x="950" y="24" text-anchor="middle" font-size="10.5" fill="#8C1D2F">设计预览 · 样例数据</text>
    <g stroke="#6F675D" stroke-width="1.4" stroke-linecap="round" fill="none">
      <line x1="1052" y1="20" x2="1062" y2="20"/>
      <rect x="1076" y="15" width="10" height="10" rx="1"/>
      <line x1="1100" y1="15" x2="1110" y2="25"/>
      <line x1="1110" y1="15" x2="1100" y2="25"/>
    </g>
  </g>

  <!-- 侧栏：编号文字导航 -->
  <g id="sidebar">
    <rect x="0" y="40" width="216" height="680" fill="#FBF8F1"/>
    <rect x="215" y="40" width="1" height="680" fill="#DED5C6"/>
    <rect x="24" y="64" width="30" height="30" rx="8" fill="#8C1D2F"/>
    <text x="39" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">H</text>
    <text x="64" y="82" font-size="17" font-weight="700" fill="#23201C">HustMCL</text>
    <text x="64" y="99" font-size="10.5" fill="#6F675D">校园启动器</text>
    <rect x="24" y="128" width="168" height="1" fill="#DED5C6"/>

    <g id="nav-home">
      <rect x="16" y="156" width="184" height="46" rx="7" fill="#F2E3DF"/>
      <rect x="16" y="166" width="3" height="24" rx="1.5" fill="#8C1D2F"/>
      <text x="32" y="183" font-size="10.5" font-weight="600" fill="#8C1D2F" letter-spacing="1">01</text>
      <text x="64" y="183" font-size="14" font-weight="700" fill="#8C1D2F">首页</text>
    </g>
    <g id="nav-install">
      <text x="32" y="229" font-size="10.5" fill="#6F675D" letter-spacing="1">02</text>
      <text x="64" y="229" font-size="14" fill="#6F675D">安装游戏</text>
    </g>
    <g id="nav-settings">
      <text x="32" y="275" font-size="10.5" fill="#6F675D" letter-spacing="1">03</text>
      <text x="64" y="275" font-size="14" fill="#6F675D">设置</text>
    </g>
    <g id="nav-logs">
      <text x="32" y="321" font-size="10.5" fill="#6F675D" letter-spacing="1">04</text>
      <text x="64" y="321" font-size="14" fill="#6F675D">日志与错误</text>
    </g>

    <g id="account">
      <rect x="24" y="580" width="168" height="1" fill="#DED5C6"/>
      <circle cx="40" cy="614" r="16" fill="#F2E3DF"/>
      <text x="40" y="619" text-anchor="middle" font-size="13" font-weight="700" fill="#8C1D2F">林</text>
      <text x="66" y="610" font-size="13" font-weight="600" fill="#23201C">林知远</text>
      <circle cx="68" cy="628" r="3" fill="#4F6B52"/>
      <text x="76" y="632" font-size="11" fill="#6F675D">已连接</text>
      <text x="24" y="660" font-size="11.5" fill="#6F675D">账号与授权 →</text>
    </g>
    <text x="24" y="700" font-size="10.5" fill="#6F675D">HustMCL 0.1 · 设计预览</text>
  </g>

  <!-- 页面标题 -->
  <g id="page-header">
    <text x="248" y="112" font-size="30" font-weight="600" fill="#23201C" letter-spacing="-0.5">下午好，林知远</text>
    <text x="248" y="136" font-size="13" fill="#6F675D">校园生存 · Minecraft 1.21.4</text>
    <text x="1088" y="136" text-anchor="end" font-size="12" fill="#6F675D">周五 · 16:42</text>
  </g>

  <!-- 单一桌面表面：当前实例、准备状态、启动摘要 -->
  <g id="desk">
    <rect x="248" y="168" width="840" height="504" rx="14" fill="#FFFCF6" stroke="#DED5C6"/>

    <g id="desk-main">
      <text x="280" y="226" font-size="30" font-weight="600" fill="#23201C" letter-spacing="-0.5">校园生存</text>
      <text x="280" y="250" font-size="13" fill="#6F675D">Minecraft 1.21.4 · 原版生存</text>
      <rect x="280" y="270" width="500" height="1" fill="#DED5C6"/>

      <text x="280" y="298" font-size="12" font-weight="600" fill="#23201C">准备状态</text>

      <circle cx="290" cy="330" r="9" fill="#E8F1EC"/>
      <text x="290" y="334" text-anchor="middle" font-size="11" fill="#2F6B4F">✓</text>
      <text x="308" y="334" font-size="13" font-weight="600" fill="#23201C">账号</text>
      <text x="400" y="334" font-size="12.5" fill="#6F675D">林知远 · 微软账号</text>
      <text x="760" y="334" text-anchor="end" font-size="11.5" fill="#4F6B52">已连接</text>
      <rect x="280" y="348" width="500" height="1" fill="#F0E9DD"/>

      <circle cx="290" cy="376" r="9" fill="#E8F1EC"/>
      <text x="290" y="380" text-anchor="middle" font-size="11" fill="#2F6B4F">✓</text>
      <text x="308" y="380" font-size="13" font-weight="600" fill="#23201C">Java 运行时</text>
      <text x="400" y="380" font-size="12.5" fill="#6F675D">由应用选择 · x64</text>
      <text x="760" y="380" text-anchor="end" font-size="11.5" fill="#4F6B52">已就绪</text>
      <rect x="280" y="394" width="500" height="1" fill="#F0E9DD"/>

      <circle cx="290" cy="422" r="9" fill="#E8F1EC"/>
      <text x="290" y="426" text-anchor="middle" font-size="11" fill="#2F6B4F">✓</text>
      <text x="308" y="426" font-size="13" font-weight="600" fill="#23201C">游戏实例</text>
      <text x="400" y="426" font-size="12.5" fill="#6F675D">文件已校验 · 可启动</text>
      <text x="760" y="426" text-anchor="end" font-size="11.5" fill="#4F6B52">已就绪</text>

      <text x="280" y="468" font-size="11.5" fill="#6F675D">启动摘要</text>
      <rect x="280" y="478" width="500" height="1" fill="#F0E9DD"/>
      <text x="280" y="500" font-size="12.5" fill="#23201C">内存上限</text>
      <text x="780" y="500" text-anchor="end" font-size="12.5" font-weight="600" fill="#23201C">4096 MB</text>
      <text x="280" y="526" font-size="12.5" fill="#23201C">启动后</text>
      <text x="780" y="526" text-anchor="end" font-size="12.5" font-weight="600" fill="#23201C">关闭启动器</text>
      <text x="280" y="556" font-size="11.5" fill="#6F675D">启动器关闭后，游戏会继续运行。</text>
    </g>

    <rect x="798" y="196" width="1" height="380" fill="#DED5C6"/>

    <g id="desk-side">
      <g transform="translate(830 192)">
        <path d="M8 112h210" fill="none" stroke="#D8CEBE"/>
        <rect x="52" y="48" width="74" height="64" fill="#F3E8D7" stroke="#7B7062" stroke-width="1.2"/>
        <path d="M44 48 89 22l45 26" fill="#8C1D2F"/>
        <path d="M44 48h90" stroke="#6E1524" stroke-width="2"/>
        <rect x="63" y="59" width="10" height="13" fill="none" stroke="#9A8B78"/>
        <rect x="80" y="59" width="10" height="13" fill="none" stroke="#9A8B78"/>
        <rect x="97" y="59" width="10" height="13" fill="none" stroke="#9A8B78"/>
        <rect x="63" y="80" width="10" height="13" fill="none" stroke="#9A8B78"/>
        <rect x="80" y="80" width="10" height="13" fill="none" stroke="#9A8B78"/>
        <rect x="97" y="80" width="10" height="13" fill="none" stroke="#9A8B78"/>
        <rect x="80" y="98" width="18" height="14" fill="none" stroke="#7B7062"/>
        <rect x="137" y="70" width="48" height="42" fill="#F7EFE3" stroke="#7B7062"/>
        <path d="M131 70h60" stroke="#7B7062"/>
        <path d="M141 82h10m12 0h10M141 94h10m12 0h10" stroke="#B7A995"/>
        <line x1="180" y1="87" x2="180" y2="112" stroke="#7B7062"/>
        <circle cx="180" cy="76" r="17" fill="#E4ECDE" stroke="#6F675D"/>
        <circle cx="167" cy="86" r="10" fill="#E4ECDE" stroke="#6F675D"/>
        <circle cx="193" cy="86" r="10" fill="#E4ECDE" stroke="#6F675D"/>
        <path d="M24 112V82" stroke="#7B7062"/>
        <circle cx="24" cy="70" r="15" fill="#E4ECDE" stroke="#6F675D"/>
        <circle cx="13" cy="80" r="9" fill="#E4ECDE" stroke="#6F675D"/>
        <circle cx="35" cy="80" r="9" fill="#E4ECDE" stroke="#6F675D"/>
        <path d="M118 112h12" stroke="#8C1D2F" stroke-width="2"/>
      </g>

      <text x="830" y="352" font-size="11.5" fill="#6F675D">小提示</text>
      <rect x="830" y="362" width="226" height="1" fill="#F0E9DD"/>
      <text x="830" y="388" font-size="12" fill="#23201C">设置中可以调整 Java、</text>
      <text x="830" y="406" font-size="12" fill="#23201C">内存与游戏目录。</text>
      <text x="830" y="434" font-size="12" fill="#23201C">遇到问题，可在日志与</text>
      <text x="830" y="452" font-size="12" fill="#23201C">错误中查看脱敏记录。</text>
      <rect x="830" y="470" width="226" height="1" fill="#F0E9DD"/>
      <text x="830" y="496" font-size="12.5" font-weight="600" fill="#8C1D2F">打开设置 →</text>
      <text x="830" y="524" font-size="12.5" font-weight="600" fill="#8C1D2F">日志与错误 →</text>
    </g>

    <g id="action-strip">
      <path d="M248 592H1088V658A14 14 0 0 1 1074 672H262A14 14 0 0 1 248 658Z" fill="#FFFCF6"/>
      <rect x="248" y="592" width="840" height="1" fill="#DED5C6"/>
      <text x="280" y="622" font-size="15" font-weight="600" fill="#23201C">准备就绪</text>
      <text x="280" y="642" font-size="12" fill="#6F675D">账号、Java 与实例均已就绪</text>
      <text x="880" y="634" text-anchor="end" font-size="12.5" fill="#6F675D">安装其他版本</text>
      <rect x="904" y="604" width="152" height="52" rx="7" fill="#8C1D2F"/>
      <text x="980" y="636" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">启动游戏</text>
    </g>
    <rect x="248" y="168" width="840" height="504" rx="14" fill="none" stroke="#DED5C6"/>
  </g>

  <g id="footer-note">
    <text x="248" y="690" font-size="10.5" fill="#6F675D">账号、实例与进度为样例数据；功能尚未接入。</text>
    <text x="1088" y="690" text-anchor="end" font-size="10.5" fill="#6F675D">Windows 系统标题栏</text>
  </g>
</svg>
