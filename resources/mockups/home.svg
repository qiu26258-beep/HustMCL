<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="homeTitle homeDesc" font-family="'Microsoft YaHei UI','Microsoft YaHei','Segoe UI',sans-serif" text-rendering="geometricPrecision">
  <title id="homeTitle">HustMCL 首页界面设计预览</title>
  <desc id="homeDesc">静态设计稿：校园主题首页，展示设计示例账号、当前实例、准备状态和一个主操作按钮。功能尚未接入。</desc>

  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#FBF7F5"/>
      <stop offset="0.62" stop-color="#F7F6F2"/>
      <stop offset="1" stop-color="#F1F6F3"/>
    </linearGradient>
    <clipPath id="heroClip">
      <rect x="264" y="128" width="824" height="184" rx="12"/>
    </clipPath>
  </defs>

  <!-- 窗口底色与系统标题栏示意 -->
  <rect x="0" y="0" width="1120" height="720" fill="#F4F6F8"/>
  <g id="titlebar">
    <rect x="0" y="0" width="1120" height="40" fill="#F7F8FA"/>
    <rect x="0" y="39" width="1120" height="1" fill="#D8DEE5"/>
    <rect x="16" y="12" width="16" height="16" rx="4" fill="#8C1D2F"/>
    <text x="24" y="23.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">H</text>
    <text x="40" y="25" font-size="12.5" font-weight="600" fill="#1E252B">HustMCL</text>
    <text x="94" y="25" font-size="11.5" fill="#5B6670">· 首页</text>
    <g stroke="#5B6670" stroke-width="1.4" stroke-linecap="round">
      <line x1="1052" y1="20" x2="1062" y2="20"/>
      <rect x="1076" y="15" width="10" height="10" rx="1" fill="none"/>
      <line x1="1100" y1="15" x2="1110" y2="25"/>
      <line x1="1110" y1="15" x2="1100" y2="25"/>
    </g>
  </g>

  <!-- 侧栏 -->
  <g id="sidebar">
    <rect x="0" y="40" width="232" height="680" fill="#FFFFFF"/>
    <rect x="231" y="40" width="1" height="680" fill="#D8DEE5"/>
    <rect x="24" y="64" width="28" height="28" rx="8" fill="#8C1D2F"/>
    <text x="38" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">H</text>
    <text x="62" y="80" font-size="17" font-weight="700" fill="#1E252B">HustMCL</text>
    <text x="62" y="97" font-size="10.5" fill="#5B6670">校园主题启动器</text>
    <rect x="24" y="116" width="184" height="1" fill="#EDF0F3"/>

    <g id="nav-home">
      <rect x="16" y="132" width="200" height="44" rx="8" fill="#F6E7EA"/>
      <rect x="16" y="142" width="3" height="24" rx="1.5" fill="#8C1D2F"/>
      <g transform="translate(33 144)" fill="none" stroke="#8C1D2F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5 10 3.5l7 6V17a1 1 0 0 1-1 1h-4v-5H8v5H4a1 1 0 0 1-1-1z"/>
      </g>
      <text x="64" y="159" font-size="14" font-weight="700" fill="#8C1D2F">首页</text>
    </g>

    <g id="nav-install">
      <g transform="translate(33 196)" fill="none" stroke="#5B6670" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 3v9m0 0 3.5-3.5M10 12 6.5 8.5M4 15.5v1A1.5 1.5 0 0 0 5.5 18h9a1.5 1.5 0 0 0 1.5-1.5v-1"/>
      </g>
      <text x="64" y="211" font-size="14" fill="#3C4650">安装游戏</text>
    </g>

    <g id="nav-settings">
      <g transform="translate(33 248)" fill="none" stroke="#5B6670" stroke-width="1.6" stroke-linecap="round">
        <line x1="3" y1="6" x2="17" y2="6"/>
        <line x1="3" y1="14" x2="17" y2="14"/>
        <circle cx="8" cy="6" r="2.4" fill="#FFFFFF"/>
        <circle cx="13" cy="14" r="2.4" fill="#FFFFFF"/>
      </g>
      <text x="64" y="263" font-size="14" fill="#3C4650">设置</text>
    </g>

    <g id="nav-logs">
      <g transform="translate(33 300)" fill="none" stroke="#5B6670" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="12" height="15" rx="2"/>
        <line x1="7" y1="7" x2="13" y2="7"/>
        <line x1="7" y1="10" x2="13" y2="10"/>
        <line x1="7" y1="13" x2="11" y2="13"/>
      </g>
      <text x="64" y="315" font-size="14" fill="#3C4650">日志与错误</text>
    </g>

    <g id="keyboard-tip">
      <rect x="24" y="548" width="184" height="108" rx="10" fill="#F7F8FA" stroke="#E3E7EC"/>
      <text x="40" y="574" font-size="12" font-weight="600" fill="#1E252B">键盘提示</text>
      <text x="40" y="596" font-size="11" fill="#5B6670">Tab 切换焦点</text>
      <text x="40" y="616" font-size="11" fill="#5B6670">Enter 执行主操作</text>
      <text x="40" y="636" font-size="11" fill="#5B6670">Esc 关闭弹层</text>
    </g>
    <text x="24" y="700" font-size="10.5" fill="#7A838D">HustMCL 0.1 · 界面设计预览</text>
  </g>

  <!-- 页面标题与账号胶囊 -->
  <g id="page-header">
    <text x="264" y="88" font-size="20" font-weight="600" fill="#1E252B">首页</text>
    <text x="264" y="110" font-size="12.5" fill="#5B6670">账号、实例与准备状态一目了然。</text>

    <rect x="812" y="64" width="276" height="48" rx="10" fill="#FFFFFF" stroke="#D8DEE5"/>
    <circle cx="836" cy="88" r="16" fill="#F6E7EA"/>
    <text x="836" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#8C1D2F">示</text>
    <text x="860" y="84" font-size="13" font-weight="600" fill="#1E252B">设计示例账号</text>
    <text x="860" y="101" font-size="11" fill="#5B6670">已登录 · 微软账号（示例）</text>
    <rect x="1010" y="70" width="64" height="20" rx="10" fill="#F6E7EA"/>
    <text x="1042" y="84" text-anchor="middle" font-size="10" fill="#8C1D2F">设计示例</text>
  </g>

  <!-- 主视觉卡片：原创校园几何插画 -->
  <g id="hero-card">
    <rect x="264" y="128" width="824" height="184" rx="12" fill="url(#heroBg)" stroke="#E3E7EC"/>
    <g clip-path="url(#heroClip)">
      <g id="campus-illustration">
        <circle cx="1022" cy="174" r="30" fill="#F2D6B4" opacity="0.55"/>
        <path d="M720 262 Q790 232 856 252 T1000 240 T1088 250 V312 H720 Z" fill="#E6EFE4"/>
        <path d="M720 278 Q820 262 918 276 T1088 266 V312 H720 Z" fill="#D8E7D8"/>

        <rect x="750" y="234" width="80" height="46" fill="#F0E6D8"/>
        <polygon points="744,234 790,210 836,234" fill="#8C1D2F"/>
        <rect x="760" y="246" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="778" y="246" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="796" y="246" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="780" y="264" width="16" height="16" rx="1" fill="#D9CDBE"/>

        <rect x="852" y="184" width="64" height="96" fill="#EDE3D5"/>
        <polygon points="844,184 884,154 924,184" fill="#8C1D2F"/>
        <circle cx="884" cy="174" r="7" fill="#FBF7F5" stroke="#C7B6A2"/>
        <line x1="884" y1="174" x2="884" y2="169" stroke="#8C1D2F" stroke-width="1.2"/>
        <line x1="884" y1="174" x2="888" y2="176" stroke="#8C1D2F" stroke-width="1.2"/>
        <rect x="862" y="196" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="878" y="196" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="894" y="196" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="862" y="216" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="878" y="216" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="894" y="216" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="862" y="236" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="878" y="236" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="894" y="236" width="10" height="12" rx="1" fill="#B9C9C9"/>
        <rect x="874" y="258" width="20" height="22" rx="1" fill="#C7B6A2"/>

        <rect x="918" y="212" width="96" height="68" fill="#F3EBE1"/>
        <polygon points="910,212 966,190 1022,212" fill="#A02439"/>
        <rect x="930" y="224" width="12" height="14" rx="1" fill="#B9C9C9"/>
        <rect x="952" y="224" width="12" height="14" rx="1" fill="#B9C9C9"/>
        <rect x="974" y="224" width="12" height="14" rx="1" fill="#B9C9C9"/>
        <rect x="930" y="248" width="12" height="14" rx="1" fill="#B9C9C9"/>
        <rect x="952" y="248" width="12" height="14" rx="1" fill="#B9C9C9"/>
        <rect x="974" y="248" width="12" height="14" rx="1" fill="#B9C9C9"/>
        <rect x="996" y="248" width="12" height="32" rx="1" fill="#D9CDBE"/>

        <rect x="736" y="258" width="4" height="28" rx="2" fill="#7A5A3A"/>
        <circle cx="738" cy="248" r="17" fill="#4F7A5A"/>
        <circle cx="727" cy="255" r="11" fill="#5E8A68"/>
        <circle cx="750" cy="255" r="11" fill="#5E8A68"/>

        <rect x="1036" y="258" width="4" height="30" rx="2" fill="#7A5A3A"/>
        <circle cx="1038" cy="246" r="18" fill="#4F7A5A"/>
        <circle cx="1026" cy="254" r="12" fill="#5E8A68"/>
        <circle cx="1050" cy="254" r="12" fill="#5E8A68"/>

        <ellipse cx="920" cy="304" rx="176" ry="16" fill="#CFE0CF" opacity="0.75"/>
        <path d="M982 312 Q1002 284 1032 278" fill="none" stroke="#C8D8C8" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
        <circle cx="800" cy="284" r="8" fill="#5E8A68"/>
        <circle cx="816" cy="288" r="6" fill="#6E9978"/>
      </g>
    </g>

    <g id="hero-copy">
      <text x="296" y="176" font-size="26" font-weight="600" fill="#1E252B">下午好，设计示例同学</text>
      <text x="296" y="204" font-size="13.5" fill="#3C4650">当前实例：校园生存 · 1.21.4（设计示例）</text>

      <rect x="296" y="222" width="104" height="26" rx="13" fill="#FFFFFF" stroke="#D8DEE5"/>
      <circle cx="310" cy="235" r="4" fill="#2F6B4F"/>
      <text x="322" y="239" font-size="11" fill="#3C4650">账号已就绪</text>

      <rect x="408" y="222" width="112" height="26" rx="13" fill="#FFFFFF" stroke="#D8DEE5"/>
      <circle cx="422" cy="235" r="4" fill="#2F6B4F"/>
      <text x="434" y="239" font-size="11" fill="#3C4650">Java 已就绪</text>

      <rect x="528" y="222" width="112" height="26" rx="13" fill="#FFFFFF" stroke="#D8DEE5"/>
      <circle cx="542" cy="235" r="4" fill="#2F6B4F"/>
      <text x="554" y="239" font-size="11" fill="#3C4650">实例已安装</text>

      <text x="296" y="272" font-size="12.5" fill="#5B6670">所有准备已完成，可以启动游戏。</text>
      <text x="296" y="294" font-size="10.5" fill="#7A838D">静态设计样例，功能尚未接入。</text>
    </g>
    <rect x="264" y="128" width="824" height="184" rx="12" fill="none" stroke="#E3E7EC"/>
  </g>

  <!-- 准备状态 -->
  <g id="readiness-card">
    <rect x="264" y="328" width="520" height="200" rx="10" fill="#FFFFFF" stroke="#D8DEE5"/>
    <text x="288" y="356" font-size="16" font-weight="600" fill="#1E252B">准备状态</text>
    <text x="288" y="374" font-size="10.5" fill="#7A838D">账号、运行时与实例状态均已确认。</text>

    <circle cx="298" cy="402" r="4" fill="#2F6B4F"/>
    <text x="314" y="400" font-size="13" font-weight="600" fill="#1E252B">账号</text>
    <text x="314" y="418" font-size="11.5" fill="#5B6670">已登录 · 设计示例账号</text>
    <rect x="688" y="390" width="72" height="24" rx="12" fill="#E8F1EC"/>
    <text x="724" y="406" text-anchor="middle" font-size="10.5" fill="#2F6B4F">就绪</text>

    <rect x="288" y="428" width="472" height="1" fill="#EDF0F3"/>
    <circle cx="298" cy="446" r="4" fill="#2F6B4F"/>
    <text x="314" y="444" font-size="13" font-weight="600" fill="#1E252B">Java 运行时</text>
    <text x="314" y="462" font-size="11.5" fill="#5B6670">x64 · 版本由应用检测（设计示例）</text>
    <rect x="688" y="434" width="72" height="24" rx="12" fill="#E8F1EC"/>
    <text x="724" y="450" text-anchor="middle" font-size="10.5" fill="#2F6B4F">就绪</text>

    <rect x="288" y="472" width="472" height="1" fill="#EDF0F3"/>
    <circle cx="298" cy="490" r="4" fill="#2F6B4F"/>
    <text x="314" y="488" font-size="13" font-weight="600" fill="#1E252B">游戏实例</text>
    <text x="314" y="506" font-size="11.5" fill="#5B6670">校园生存 · 1.21.4（设计示例）</text>
    <rect x="688" y="478" width="72" height="24" rx="12" fill="#E8F1EC"/>
    <text x="724" y="494" text-anchor="middle" font-size="10.5" fill="#2F6B4F">就绪</text>
  </g>

  <!-- 启动摘要 -->
  <g id="launch-summary-card">
    <rect x="804" y="328" width="284" height="200" rx="10" fill="#FFFFFF" stroke="#D8DEE5"/>
    <text x="828" y="356" font-size="16" font-weight="600" fill="#1E252B">启动摘要</text>

    <text x="828" y="386" font-size="11.5" fill="#5B6670">内存上限</text>
    <text x="1064" y="386" text-anchor="end" font-size="12" font-weight="600" fill="#1E252B">4096 MB（设计示例）</text>
    <rect x="828" y="400" width="236" height="1" fill="#EDF0F3"/>

    <text x="828" y="422" font-size="11.5" fill="#5B6670">启动后</text>
    <text x="1064" y="422" text-anchor="end" font-size="12" fill="#1E252B">关闭启动器（设计示例）</text>
    <rect x="828" y="436" width="236" height="1" fill="#EDF0F3"/>

    <text x="828" y="460" font-size="11" fill="#5B6670">可在设置中调整 Java、内存与目录。</text>
    <text x="828" y="488" font-size="12" font-weight="600" fill="#8C1D2F">打开设置 ›</text>
  </g>

  <!-- 固定主操作栏 -->
  <g id="primary-action-bar">
    <rect x="264" y="544" width="824" height="100" rx="12" fill="#FFFFFF" stroke="#D8DEE5"/>
    <text x="288" y="574" font-size="16" font-weight="600" fill="#1E252B">准备就绪</text>
    <text x="288" y="596" font-size="12" fill="#5B6670">启动后可以关闭启动器，游戏会继续运行。</text>
    <text x="288" y="618" font-size="10.5" fill="#7A838D">遇到问题？可在「日志与错误」查看脱敏记录。</text>
    <rect x="920" y="562" width="144" height="52" rx="8" fill="#8C1D2F"/>
    <text x="992" y="594" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">启动游戏</text>
  </g>

  <!-- 页脚说明 -->
  <g id="footer-note">
    <text x="264" y="668" font-size="11" fill="#5B6670">设计示例：账号、实例、版本与内存数据均为静态样稿；功能尚未接入。</text>
    <text x="264" y="686" font-size="10.5" fill="#7A838D">窗口使用 Windows 系统标题栏；顶部为系统栏示意。</text>
  </g>
</svg>
